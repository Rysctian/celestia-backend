name: celestia

x-app: &app
  build:
    context: .
    target: production
    args:
      INSTALL_DEV: ${INSTALL_DEV:-false}
  image: celestia-backend:latest
  env_file: .env.docker
  restart: unless-stopped
  volumes:
    - storage:/var/www/html/storage
  depends_on:
    db:
      condition: service_healthy

services:
  # Laravel via php-fpm. Runs migrations + menu/access seeding on start.
  app:
    <<: *app

  # Serves /public and proxies PHP to the app container.
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8000}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    depends_on:
      - app

  # QUEUE_CONNECTION=database requires a worker.
  queue:
    <<: *app
    command: php artisan queue:work --tries=3 --timeout=90 --sleep=3
    environment:
      RUN_SETUP: "false"
    depends_on:
      - app

  db:
    image: mysql:8.4
    restart: unless-stopped
    env_file: .env.docker
    environment:
      TZ: Asia/Manila
    entrypoint:
      - /bin/sh
      - -c
      - |
        : "$${DB_PASSWORD:?Set DB_PASSWORD in .env.docker}"
        : "$${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env.docker}"
        export MYSQL_DATABASE="$${DB_DATABASE:-celestia}"
        export MYSQL_USER="$${DB_USERNAME:-celestia}"
        export MYSQL_PASSWORD="$${DB_PASSWORD}"
        export MYSQL_ROOT_PASSWORD="$${DB_ROOT_PASSWORD}"
        exec docker-entrypoint.sh "$$@"
      - docker-entrypoint.sh
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "${DB_FORWARD_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$DB_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db-data:
  storage:
