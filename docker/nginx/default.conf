server {
    listen 80;
    server_name _;
    server_tokens off;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 10M;

    # Re-resolve `app` after it is recreated.
    resolver 127.0.0.11 valid=10s;
    set $fpm app:9000;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Public uploads. ^~ stops the .php rule below from matching in here.
    # With this you don't need `artisan storage:link` at all.
    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        expires 7d;
        add_header X-Content-Type-Options nosniff;
    }

    location = /index.php {
        fastcgi_pass $fpm;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}